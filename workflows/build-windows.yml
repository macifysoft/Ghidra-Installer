# Builds GhidraInstaller.exe on a GitHub-hosted Windows machine.
#
# Runs when:
#   • you start it from your Mac:   python3 build_windows_on_github.py
#   • you click "Run workflow" on the repo's Actions tab
#   • you publish a GitHub release — the zip is attached to that release
#
# Output: GhidraInstaller_Windows.zip  (contains GhidraInstaller.exe)

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also attach the zip to this existing release tag (optional, e.g. v1.1)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write          # needed to attach the zip to a release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller certifi
          python -c "import PyInstaller, tkinter; print('PyInstaller', PyInstaller.__version__, '| Tk', tkinter.TkVersion)"

      - name: Fetch Ghidra icon
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/NationalSecurityAgency/ghidra/master/Ghidra/RuntimeScripts/support/ghidra.ico"
          try {
            Invoke-WebRequest -Uri $url -OutFile ghidra.ico -UseBasicParsing
            Write-Host "Icon downloaded ($((Get-Item ghidra.ico).Length) bytes)"
          } catch {
            Write-Host "::warning::Could not download the Ghidra icon - building with the default icon"
          }

      - name: Build GhidraInstaller.exe
        shell: pwsh
        run: |
          $pyiArgs = @(
            "--onefile", "--windowed", "--clean", "--noconfirm",
            "--name", "GhidraInstaller",
            "--hidden-import", "tkinter",
            "--hidden-import", "tkinter.ttk",
            "--hidden-import", "tkinter.filedialog",
            "--hidden-import", "tkinter.messagebox",
            "--hidden-import", "certifi",
            "--collect-data", "certifi"
          )
          if (Test-Path ghidra.ico) { $pyiArgs += @("--icon", "ghidra.ico") }
          $pyiArgs += "ghidra_installer_windows.py"
          python -m PyInstaller @args
          if (-not (Test-Path dist\GhidraInstaller.exe)) { throw "GhidraInstaller.exe was not produced" }

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # Start the GUI, give it a few seconds, make sure it didn't crash on launch.
          $p = Start-Process -FilePath dist\GhidraInstaller.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "GhidraInstaller.exe exited straight away (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Launched and stayed running - OK"

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GhidraInstaller.exe -DestinationPath GhidraInstaller_Windows.zip -Force
          $h = (Get-FileHash GhidraInstaller_Windows.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "GhidraInstaller_Windows.zip  SHA-256: $h"
          "### Windows build`n`n``GhidraInstaller_Windows.zip`` SHA-256: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhidraInstaller_Windows
          path: GhidraInstaller_Windows.zip
          retention-days: 14

      - name: Attach to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$env:TAG" GhidraInstaller_Windows.zip --clobber --repo "${{ github.repository }}"
          Write-Host "Attached to release $env:TAG"
